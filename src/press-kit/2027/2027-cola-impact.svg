<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="654" viewBox="0 0 1200 654" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"><title id="t">A 3.6% COLA would add $43 to $93 a month to Social Security checks of $1,200 to $2,600</title><desc id="d">ESTIMATE, not the official 2027 figure. Uses the 3.6% forecast published by The Senior Citizens League on August 12, 2026. The Social Security Administration is expected to announce the official COLA on October 14, 2026.</desc><rect width="1200" height="654" fill="#ffffff"/><rect x="1022" y="44" width="130" height="32" rx="6" fill="none" stroke="#0b0b0b" stroke-width="2"/><text x="1087" y="65" font-size="15" font-weight="700" fill="#0b0b0b" text-anchor="middle" letter-spacing="0.12em">ESTIMATE</text><text x="48" y="72" font-size="30" font-weight="650" fill="#0b0b0b">A 3.6% COLA would add $43 to $93 a month</text><text x="48" y="110" font-size="30" font-weight="650" fill="#0b0b0b">to Social Security checks of $1,200 to $2,600</text><text x="48" y="150" font-size="17" font-weight="400" fill="#52514e">ESTIMATE, not the official 2027 figure. Uses the 3.6% forecast published by The Senior Citizens League on August 12, 2026. The Social</text><text x="48" y="175" font-size="17" font-weight="400" fill="#52514e">Security Administration is expected to announce the official COLA on October 14, 2026.</text><line x1="298" x2="298" y1="222" y2="456" stroke="#c3c2b7" stroke-width="1"/><text x="298" y="478" font-size="13" font-weight="400" fill="#898781" text-anchor="middle">$0</text><line x1="410.8" x2="410.8" y1="222" y2="456" stroke="#e1e0d9" stroke-width="1"/><text x="410.8" y="478" font-size="13" font-weight="400" fill="#898781" text-anchor="middle">$20</text><line x1="523.6" x2="523.6" y1="222" y2="456" stroke="#e1e0d9" stroke-width="1"/><text x="523.6" y="478" font-size="13" font-weight="400" fill="#898781" text-anchor="middle">$40</text><line x1="636.4" x2="636.4" y1="222" y2="456" stroke="#e1e0d9" stroke-width="1"/><text x="636.4" y="478" font-size="13" font-weight="400" fill="#898781" text-anchor="middle">$60</text><line x1="749.2" x2="749.2" y1="222" y2="456" stroke="#e1e0d9" stroke-width="1"/><text x="749.2" y="478" font-size="13" font-weight="400" fill="#898781" text-anchor="middle">$80</text><line x1="862" x2="862" y1="222" y2="456" stroke="#e1e0d9" stroke-width="1"/><text x="862" y="478" font-size="13" font-weight="400" fill="#898781" text-anchor="middle">$100</text><text x="298" y="502" font-size="13" font-weight="400" fill="#898781">Increase in the monthly payment</text><text x="48" y="257" font-size="18" font-weight="600" fill="#0b0b0b">$1,200 a month now</text><text x="48" y="279" font-size="15" font-weight="400" fill="#52514e">becomes $1,243</text><path d="M298,249 H536.52 Q540.52,249 540.52,253 V269 Q540.52,273 536.52,273 H298 Z" fill="#2a78d6"/><text x="552.52" y="267" font-size="18" font-weight="650" fill="#0b0b0b">+$43 a month<tspan font-size="15" font-weight="400" fill="#52514e">  ($516 a year)</tspan></text><text x="48" y="335" font-size="18" font-weight="600" fill="#0b0b0b">$1,900 a month now</text><text x="48" y="357" font-size="15" font-weight="400" fill="#52514e">becomes $1,968</text><path d="M298,327 H677.52 Q681.52,327 681.52,331 V347 Q681.52,351 677.52,351 H298 Z" fill="#2a78d6"/><text x="693.52" y="345" font-size="18" font-weight="650" fill="#0b0b0b">+$68 a month<tspan font-size="15" font-weight="400" fill="#52514e">  ($816 a year)</tspan></text><text x="48" y="413" font-size="18" font-weight="600" fill="#0b0b0b">$2,600 a month now</text><text x="48" y="435" font-size="15" font-weight="400" fill="#52514e">becomes $2,693</text><path d="M298,405 H818.52 Q822.52,405 822.52,409 V425 Q822.52,429 818.52,429 H298 Z" fill="#2a78d6"/><text x="834.52" y="423" font-size="18" font-weight="650" fill="#0b0b0b">+$93 a month<tspan font-size="15" font-weight="400" fill="#52514e">  ($1,116 a year)</tspan></text><text x="48" y="526" font-size="13.5" font-weight="400" fill="#52514e">Social Security rounds each new monthly payment down to the whole dollar, and the increases shown are after that rounding. Amounts are gross, before Medicare</text><text x="48" y="545" font-size="13.5" font-weight="400" fill="#52514e">premiums or tax withholding come out.</text><line x1="48" x2="1152" y1="576" y2="576" stroke="#e1e0d9" stroke-width="1"/><text x="1152" y="600" font-size="15" font-weight="700" fill="#0b0b0b" text-anchor="end">Chart: tools-berry.com</text><text x="48" y="600" font-size="13.5" font-weight="400" fill="#898781">Source: Tools Berry calculation (tools-berry.com/2027-social-security-cola/). COLA: The Senior Citizens League estimate, August 12, 2026.</text></svg>
