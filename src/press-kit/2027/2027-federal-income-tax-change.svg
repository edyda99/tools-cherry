<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="868" viewBox="0 0 1200 868" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"><title id="t">Projected 2027 brackets would cut federal income tax by $68 to $561 on unchanged pay</title><desc id="d">PROJECTED: the IRS has not published official 2027 figures yet. 2027 uses the brackets and standard deduction projected by Bloomberg Tax, Thomson Reuters and Wolters Kluwer, which agree on every figure; 2026 uses the official IRS figures (Rev. Proc. 2025-32). Federal income tax on wages, standard deduction, before credits.</desc><rect width="1200" height="868" fill="#ffffff"/><rect x="1013" y="44" width="139" height="32" rx="6" fill="none" stroke="#0b0b0b" stroke-width="2"/><text x="1082.5" y="65" font-size="15" font-weight="700" fill="#0b0b0b" text-anchor="middle" letter-spacing="0.12em">PROJECTED</text><text x="48" y="72" font-size="30" font-weight="650" fill="#0b0b0b">Projected 2027 brackets would cut federal</text><text x="48" y="110" font-size="30" font-weight="650" fill="#0b0b0b">income tax by $68 to $561 on unchanged pay</text><text x="48" y="150" font-size="17" font-weight="400" fill="#52514e">PROJECTED: the IRS has not published official 2027 figures yet. 2027 uses the brackets and standard deduction projected by</text><text x="48" y="175" font-size="17" font-weight="400" fill="#52514e">Bloomberg Tax, Thomson Reuters and Wolters Kluwer, which agree on every figure; 2026 uses the official IRS figures (Rev. Proc.</text><text x="48" y="200" font-size="17" font-weight="400" fill="#52514e">2025-32). Federal income tax on wages, standard deduction, before credits.</text><line x1="248" x2="248" y1="247" y2="651" stroke="#c3c2b7" stroke-width="1"/><text x="248" y="673" font-size="13" font-weight="400" fill="#898781" text-anchor="middle">$0</text><line x1="320.3333333333333" x2="320.3333333333333" y1="247" y2="651" stroke="#e1e0d9" stroke-width="1"/><text x="320.3333333333333" y="673" font-size="13" font-weight="400" fill="#898781" text-anchor="middle">$100</text><line x1="392.66666666666663" x2="392.66666666666663" y1="247" y2="651" stroke="#e1e0d9" stroke-width="1"/><text x="392.66666666666663" y="673" font-size="13" font-weight="400" fill="#898781" text-anchor="middle">$200</text><line x1="465" x2="465" y1="247" y2="651" stroke="#e1e0d9" stroke-width="1"/><text x="465" y="673" font-size="13" font-weight="400" fill="#898781" text-anchor="middle">$300</text><line x1="537.3333333333333" x2="537.3333333333333" y1="247" y2="651" stroke="#e1e0d9" stroke-width="1"/><text x="537.3333333333333" y="673" font-size="13" font-weight="400" fill="#898781" text-anchor="middle">$400</text><line x1="609.6666666666667" x2="609.6666666666667" y1="247" y2="651" stroke="#e1e0d9" stroke-width="1"/><text x="609.6666666666667" y="673" font-size="13" font-weight="400" fill="#898781" text-anchor="middle">$500</text><line x1="682" x2="682" y1="247" y2="651" stroke="#e1e0d9" stroke-width="1"/><text x="682" y="673" font-size="13" font-weight="400" fill="#898781" text-anchor="middle">$600</text><text x="248" y="697" font-size="13" font-weight="400" fill="#898781">Less federal income tax in 2027 than in 2026, same pay</text><text x="48" y="273" font-size="17" font-weight="700" fill="#0b0b0b">Single filer</text><text x="48" y="320" font-size="17" font-weight="500" fill="#0b0b0b">$50,000 wages</text><path d="M248,303 H293.18666666666667 Q297.18666666666667,303 297.18666666666667,307 V321 Q297.18666666666667,325 293.18666666666667,325 H248 Z" fill="#2a78d6"/><text x="309.18666666666667" y="320" font-size="17" font-weight="650" fill="#0b0b0b">$68 less<tspan font-size="14.5" font-weight="400" fill="#52514e">  $3,820 in 2026, $3,752 projected for 2027</tspan></text><text x="48" y="374" font-size="17" font-weight="500" fill="#0b0b0b">$100,000 wages</text><path d="M248,357 H446.5333333333333 Q450.5333333333333,357 450.5333333333333,361 V375 Q450.5333333333333,379 446.5333333333333,379 H248 Z" fill="#2a78d6"/><text x="462.5333333333333" y="374" font-size="17" font-weight="650" fill="#0b0b0b">$280 less<tspan font-size="14.5" font-weight="400" fill="#52514e">  $13,170 in 2026, $12,890 projected for 2027</tspan></text><text x="48" y="428" font-size="17" font-weight="500" fill="#0b0b0b">$200,000 wages</text><path d="M248,411 H503.6766666666667 Q507.6766666666667,411 507.6766666666667,415 V429 Q507.6766666666667,433 503.6766666666667,433 H248 Z" fill="#2a78d6"/><text x="519.6766666666667" y="428" font-size="17" font-weight="650" fill="#0b0b0b">$359 less<tspan font-size="14.5" font-weight="400" fill="#52514e">  $36,734 in 2026, $36,375 projected for 2027</tspan></text><text x="48" y="475" font-size="17" font-weight="700" fill="#0b0b0b">Married filing jointly</text><text x="48" y="522" font-size="17" font-weight="500" fill="#0b0b0b">$50,000 wages</text><path d="M248,505 H316.3333333333333 Q320.3333333333333,505 320.3333333333333,509 V523 Q320.3333333333333,527 316.3333333333333,527 H248 Z" fill="#2a78d6"/><text x="332.3333333333333" y="522" font-size="17" font-weight="650" fill="#0b0b0b">$100 less<tspan font-size="14.5" font-weight="400" fill="#52514e">  $1,780 in 2026, $1,680 projected for 2027</tspan></text><text x="48" y="576" font-size="17" font-weight="500" fill="#0b0b0b">$100,000 wages</text><path d="M248,559 H342.37333333333333 Q346.37333333333333,559 346.37333333333333,563 V577 Q346.37333333333333,581 342.37333333333333,581 H248 Z" fill="#2a78d6"/><text x="358.37333333333333" y="576" font-size="17" font-weight="650" fill="#0b0b0b">$136 less<tspan font-size="14.5" font-weight="400" fill="#52514e">  $7,640 in 2026, $7,504 projected for 2027</tspan></text><text x="48" y="630" font-size="17" font-weight="500" fill="#0b0b0b">$200,000 wages</text><path d="M248,613 H649.79 Q653.79,613 653.79,617 V631 Q653.79,635 649.79,635 H248 Z" fill="#2a78d6"/><text x="665.79" y="630" font-size="17" font-weight="650" fill="#0b0b0b">$561 less<tspan font-size="14.5" font-weight="400" fill="#52514e">  $26,340 in 2026, $25,779 projected for 2027</tspan></text><text x="48" y="721" font-size="13.5" font-weight="400" fill="#52514e">Pay is held at the same dollar amount in both years; the brackets and standard deduction rise with inflation each year. Excludes the deductions for tips, overtime, seniors</text><text x="48" y="740" font-size="13.5" font-weight="400" fill="#52514e">and car-loan interest, and all credits.</text><line x1="48" x2="1152" y1="771" y2="771" stroke="#e1e0d9" stroke-width="1"/><text x="1152" y="795" font-size="15" font-weight="700" fill="#0b0b0b" text-anchor="end">Chart: tools-berry.com</text><text x="48" y="795" font-size="13.5" font-weight="400" fill="#898781">Source: Tools Berry calculation (tools-berry.com/2027-tax-brackets/). 2027 projections: Bloomberg Tax, Thomson Reuters and Wolters</text><text x="48" y="814" font-size="13.5" font-weight="400" fill="#898781">Kluwer. 2026: IRS Rev. Proc. 2025-32.</text></svg>
