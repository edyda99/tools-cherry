<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="824" viewBox="0 0 1200 824" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"><title id="t">New 2027 brackets cut federal income tax by $68 to $561 on unchanged pay</title><desc id="d">Official 2027 figures from the IRS (Rev. Proc. 2026-35, published November 5, 2026) compared with official 2026 figures (Rev. Proc. 2025-32). Federal income tax on wages, standard deduction, before credits.</desc><rect width="1200" height="824" fill="#ffffff"/><rect x="1025" y="44" width="127" height="32" rx="6" fill="none" stroke="#0b0b0b" stroke-width="2"/><text x="1088.5" y="65" font-size="15" font-weight="700" fill="#0b0b0b" text-anchor="middle" letter-spacing="0.12em">OFFICIAL</text><text x="48" y="72" font-size="30" font-weight="650" fill="#0b0b0b">New 2027 brackets cut federal income</text><text x="48" y="110" font-size="30" font-weight="650" fill="#0b0b0b">tax by $68 to $561 on unchanged pay</text><text x="48" y="150" font-size="17" font-weight="400" fill="#52514e">Official 2027 figures from the IRS (Rev. Proc. 2026-35, published November 5, 2026) compared with official 2026 figures (Rev. Proc.</text><text x="48" y="175" font-size="17" font-weight="400" fill="#52514e">2025-32). Federal income tax on wages, standard deduction, before credits.</text><line x1="248" x2="248" y1="222" y2="626" stroke="#c3c2b7" stroke-width="1"/><text x="248" y="648" font-size="13" font-weight="400" fill="#898781" text-anchor="middle">$0</text><line x1="320.3333333333333" x2="320.3333333333333" y1="222" y2="626" stroke="#e1e0d9" stroke-width="1"/><text x="320.3333333333333" y="648" font-size="13" font-weight="400" fill="#898781" text-anchor="middle">$100</text><line x1="392.66666666666663" x2="392.66666666666663" y1="222" y2="626" stroke="#e1e0d9" stroke-width="1"/><text x="392.66666666666663" y="648" font-size="13" font-weight="400" fill="#898781" text-anchor="middle">$200</text><line x1="465" x2="465" y1="222" y2="626" stroke="#e1e0d9" stroke-width="1"/><text x="465" y="648" font-size="13" font-weight="400" fill="#898781" text-anchor="middle">$300</text><line x1="537.3333333333333" x2="537.3333333333333" y1="222" y2="626" stroke="#e1e0d9" stroke-width="1"/><text x="537.3333333333333" y="648" font-size="13" font-weight="400" fill="#898781" text-anchor="middle">$400</text><line x1="609.6666666666667" x2="609.6666666666667" y1="222" y2="626" stroke="#e1e0d9" stroke-width="1"/><text x="609.6666666666667" y="648" font-size="13" font-weight="400" fill="#898781" text-anchor="middle">$500</text><line x1="682" x2="682" y1="222" y2="626" stroke="#e1e0d9" stroke-width="1"/><text x="682" y="648" font-size="13" font-weight="400" fill="#898781" text-anchor="middle">$600</text><text x="248" y="672" font-size="13" font-weight="400" fill="#898781">Less federal income tax in 2027 than in 2026, same pay</text><text x="48" y="248" font-size="17" font-weight="700" fill="#0b0b0b">Single filer</text><text x="48" y="295" font-size="17" font-weight="500" fill="#0b0b0b">$50,000 wages</text><path d="M248,278 H293.18666666666667 Q297.18666666666667,278 297.18666666666667,282 V296 Q297.18666666666667,300 293.18666666666667,300 H248 Z" fill="#2a78d6"/><text x="309.18666666666667" y="295" font-size="17" font-weight="650" fill="#0b0b0b">$68 less<tspan font-size="14.5" font-weight="400" fill="#52514e">  $3,820 in 2026, $3,752 in 2027</tspan></text><text x="48" y="349" font-size="17" font-weight="500" fill="#0b0b0b">$100,000 wages</text><path d="M248,332 H446.5333333333333 Q450.5333333333333,332 450.5333333333333,336 V350 Q450.5333333333333,354 446.5333333333333,354 H248 Z" fill="#2a78d6"/><text x="462.5333333333333" y="349" font-size="17" font-weight="650" fill="#0b0b0b">$280 less<tspan font-size="14.5" font-weight="400" fill="#52514e">  $13,170 in 2026, $12,890 in 2027</tspan></text><text x="48" y="403" font-size="17" font-weight="500" fill="#0b0b0b">$200,000 wages</text><path d="M248,386 H503.6766666666667 Q507.6766666666667,386 507.6766666666667,390 V404 Q507.6766666666667,408 503.6766666666667,408 H248 Z" fill="#2a78d6"/><text x="519.6766666666667" y="403" font-size="17" font-weight="650" fill="#0b0b0b">$359 less<tspan font-size="14.5" font-weight="400" fill="#52514e">  $36,734 in 2026, $36,375 in 2027</tspan></text><text x="48" y="450" font-size="17" font-weight="700" fill="#0b0b0b">Married filing jointly</text><text x="48" y="497" font-size="17" font-weight="500" fill="#0b0b0b">$50,000 wages</text><path d="M248,480 H316.3333333333333 Q320.3333333333333,480 320.3333333333333,484 V498 Q320.3333333333333,502 316.3333333333333,502 H248 Z" fill="#2a78d6"/><text x="332.3333333333333" y="497" font-size="17" font-weight="650" fill="#0b0b0b">$100 less<tspan font-size="14.5" font-weight="400" fill="#52514e">  $1,780 in 2026, $1,680 in 2027</tspan></text><text x="48" y="551" font-size="17" font-weight="500" fill="#0b0b0b">$100,000 wages</text><path d="M248,534 H342.37333333333333 Q346.37333333333333,534 346.37333333333333,538 V552 Q346.37333333333333,556 342.37333333333333,556 H248 Z" fill="#2a78d6"/><text x="358.37333333333333" y="551" font-size="17" font-weight="650" fill="#0b0b0b">$136 less<tspan font-size="14.5" font-weight="400" fill="#52514e">  $7,640 in 2026, $7,504 in 2027</tspan></text><text x="48" y="605" font-size="17" font-weight="500" fill="#0b0b0b">$200,000 wages</text><path d="M248,588 H649.79 Q653.79,588 653.79,592 V606 Q653.79,610 649.79,610 H248 Z" fill="#2a78d6"/><text x="665.79" y="605" font-size="17" font-weight="650" fill="#0b0b0b">$561 less<tspan font-size="14.5" font-weight="400" fill="#52514e">  $26,340 in 2026, $25,779 in 2027</tspan></text><text x="48" y="696" font-size="13.5" font-weight="400" fill="#52514e">Pay is held at the same dollar amount in both years; the brackets and standard deduction rise with inflation each year. Excludes the deductions for tips, overtime, seniors</text><text x="48" y="715" font-size="13.5" font-weight="400" fill="#52514e">and car-loan interest, and all credits.</text><line x1="48" x2="1152" y1="746" y2="746" stroke="#e1e0d9" stroke-width="1"/><text x="1152" y="770" font-size="15" font-weight="700" fill="#0b0b0b" text-anchor="end">Chart: tools-berry.com</text><text x="48" y="770" font-size="13.5" font-weight="400" fill="#898781">Source: Tools Berry calculation (tools-berry.com/2027-tax-brackets/). 2027: IRS Rev. Proc. 2026-35. 2026: IRS Rev. Proc. 2025-32.</text></svg>
