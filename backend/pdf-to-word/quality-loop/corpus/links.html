<!doctype html><html lang="en"><head><meta charset="utf-8"><style>
@page { size: A4; margin: 2cm;  }
html { font-family: Helvetica, Arial, sans-serif; font-size: 11pt; color: #111; }
h1 { font-size: 22pt; margin: 0 0 10pt; }
h2 { font-size: 16pt; margin: 14pt 0 6pt; }
h3 { font-size: 13pt; margin: 10pt 0 4pt; }
p  { margin: 0 0 8pt; line-height: 1.45; }
li { margin: 0 0 3pt; line-height: 1.4; }
table { border-collapse: collapse; margin: 8pt 0; }
td, th { padding: 4pt 8pt; font-size: 10.5pt; text-align: left; }
.bordered td, .bordered th { border: 1pt solid #444; }
.cols { column-count: 2; column-gap: 24px; }
.justify p { text-align: justify; hyphens: auto; }
.narrow { width: 190pt; }
.narrow p { text-align: left; hyphens: auto; }
a { color: #0645ad; text-decoration: underline; }
</style></head><body><h1>Further Reading</h1><p>The converter's homepage at <a href="https://tools-berry.com/">tools-berry.com</a> lists every utility, while the <a href="https://tools-berry.com/pdf-to-word/">PDF to Word tool</a> documents the in-browser path in detail.</p><p>Standards references live at the <a href="https://www.ecma-international.org/publications-and-standards/standards/ecma-376/">OOXML specification</a>, which defines every element a .docx file may contain.</p></body></html>
